name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, labeled]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python evals/run_eval.py --retrieval-only --split all

  # Paid: runs only when asked (manual run, or a PR labelled "run-evals").
  # Fails if any unsafe auto-reply appears on the dev split.
  eval:
    needs: test
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-evals')
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python evals/run_eval.py --split dev --tag "ci ${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/*.json
