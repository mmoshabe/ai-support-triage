name: ci

# Free checks only: no API key is used and no paid model calls are made.
# Paid evals are run locally on purpose: uv run python evals/run_eval.py --split dev

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python evals/run_eval.py --retrieval-only --split all
